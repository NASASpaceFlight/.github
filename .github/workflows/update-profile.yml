name: Update profile

on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"  
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile/README.md"
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild profile/README.md
        env:
          NEXTSPACEFLIGHT_API_URL: ${{ secrets.NEXTSPACEFLIGHT_API_URL }}
        run: node scripts/build-profile.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "Update profile [skip ci]"
          git push
